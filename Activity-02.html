<html>
	<head>
	<title>List</title>
	<style type = "text/css">
	body
		{
			background-color: #ADD8E6;
			font-family: verdana;
			color: #699DB8	
		}
		h1 {
			font-family: "Times new roman";
			color: #8DB1C2	
		}
		ol {
			background-color: #7EFCE5;
			color: #699DB8	
		}
		ul {
			background-color: #53ABC9;
			color: #FAF5E8	
		}
	</style>
	</head>
	<body>
		<h1>HTML List</h1>
		<p>
			Ordered list are list that is in a particular.
		</p>
		<ol>
			<li>President</li>
			<li>Vice President</li>
			<li>Governor</li>
			<li>Vice Governor</li>
			<li>Mayor</li>
			<li>Vice Mayor</li>
		</ol>
		<p>
			Unordered list are list that is in a particular.
		</p>
		<ul>
			<li>Banana</li>
			<li>Watermelon</li>
			<li>Grapes</li>
			<li>Apple</li>
			<li>Orange</li>
			<li>Pineapple</li>
		</ul>
	</body>
</html>
